# Tests every push/PR. On main (or a manual run) it also builds the image in parallel and pushes it to ghcr.io with a
# layer cache; the VPS then pulls only the layers that changed, so a code change moves a few MB instead of the whole image.
# All keys come from GitHub Secrets and are written to the server's .env at deploy time; nothing secret is in the repo or image.
#
# Secrets (Settings → Secrets and variables → Actions → Secrets):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY          SSH access to the Zarqa VPS (private key, user must be able to run docker)
#   VPS_PORT                                 optional, default 22
#   VPS_KNOWN_HOSTS                          optional but recommended: the VPS's host key line(s) (ssh-keyscan output
#                                            checked once by hand); without it the key is trusted on first use each run
#   GEMINI_API_KEY, RESEND_API_KEY           API keys (Gemini does embeddings, and everything else when DeepSeek is unset)
#   DEEPSEEK_API_KEY                         optional: when set, DeepSeek runs the chat bot and reads pages
# The database password and sign-in secret are generated on the VPS on the first deploy (generated.env) and kept.
#   GOOGLE_API_KEY                           optional (Drive import)
# Variables (same page → Variables tab), all optional:
#   UPLOADERS      comma-separated uni IDs, e.g. 24-0161,24-0200
#   PUBLIC_URL     e.g. https://drive.tryzarqa.com
#   APP_PORT       host port on 127.0.0.1, default 8080
#   DEPLOY_DIR     folder on the VPS relative to the SSH user's home (a leading ~/ is fine), default drivealt
#   GEMINI_MODEL   default gemini-3.8-flash
#   DEEPSEEK_MODEL default deepseek-chat
#   CODEX_BASE_URL e.g. http://codex:8090/v1: read pages through the Zarqa stack's Codex gateway (ChatGPT login)
#   CODEX_MODEL    default gpt-6.1-sol
# Every deploy also runs deploy/ensure-caddy.sh on the VPS: Zarqa's deploys replace the shared Caddyfile and have
# dropped DriveAlt's site before (Cloudflare 525). caddy-guard.yml runs the same check every 15 minutes.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install converters
        timeout-minutes: 5
        run: |
          # The runner's Azure mirror can stall; use Ubuntu's official HTTPS mirror.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends poppler-utils
      - name: Backend tests
        env:
          DRIVEALT_TEST_PG: Host=localhost;Username=postgres;Password=postgres;Database=postgres
        run: dotnet test
      - name: Frontend tests and build
        working-directory: web
        run: npm ci && npm test && npx tsc -b && npx vite build --outDir ../.ci-web

  build:
    # Only main ships, also for a manual run (Run workflow on another branch only runs the tests).
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time across triggers (shared with caddy-guard.yml); a queued run waits instead of cancelling.
    concurrency:
      group: drivealt-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=""
          for n in VPS_HOST VPS_USER VPS_SSH_KEY; do
            [ -z "${!n}" ] && missing="$missing $n"
          done
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing"; exit 1; fi
          # Not fatal (the app starts without them), but say so instead of shipping a silently broken feature.
          [ -n "$RESEND_API_KEY" ] || echo "::warning::RESEND_API_KEY is not set: sign-in codes only reach the app log, not email."
          [ -n "$GEMINI_API_KEY" ] || echo "::warning::GEMINI_API_KEY is not set: no embeddings (keyword search only)."

      - name: Set up SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS is not set: the VPS host key is trusted on first use (set the secret to pin it)."
            ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            Port ${VPS_PORT:-22}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/id_deploy
            ServerAliveInterval 30
          EOF

      - name: Write .env from secrets
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          CODEX_BASE_URL: ${{ vars.CODEX_BASE_URL }}
          CODEX_MODEL: ${{ vars.CODEX_MODEL }}
          UPLOADERS: ${{ vars.UPLOADERS }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          APP_PORT: ${{ vars.APP_PORT }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          umask 077
          {
            echo "DRIVEALT_IMAGE=$IMAGE"
            echo "APP_PORT=${APP_PORT:-8080}"
            echo "App__Name=DriveAlt"
            echo "App__PublicUrl=${PUBLIC_URL:-http://localhost:${APP_PORT:-8080}}"
            echo "Auth__EmailTemplate={id}@student.gutech.edu.om"
            i=0
            for id in $(echo "${UPLOADERS:-}" | tr ',' ' '); do echo "Auth__Uploaders__${i}=${id}"; i=$((i+1)); done
            echo "Resend__ApiKey=$RESEND_API_KEY"
            echo "Resend__From=DriveAlt <noreply@tryzarqa.com>"
            echo "Gemini__ApiKey=$GEMINI_API_KEY"
            echo "Gemini__Model=${GEMINI_MODEL:-gemini-3.8-flash}"
            echo "Gemini__EmbeddingModel=gemini-embedding-001"
            echo "DeepSeek__ApiKey=$DEEPSEEK_API_KEY"
            echo "DeepSeek__Model=${DEEPSEEK_MODEL:-deepseek-chat}"
            echo "Codex__BaseUrl=${CODEX_BASE_URL:-}"
            echo "Codex__Model=${CODEX_MODEL:-gpt-6.1-sol}"
            echo "Google__ApiKey=$GOOGLE_API_KEY"
          } > deploy.env

      - name: Pull image and ship config
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dir="${DEPLOY_DIR:-drivealt}"; dir="${dir#\~/}"   # relative to the SSH user's home, for ssh and scp alike
          ssh vps "mkdir -p '$dir' && chmod 700 '$dir'"
          # First deploy only: generate the database password and sign-in secret on the server and keep them.
          # Never write empty values and never regenerate: Postgres keeps the password it was first created with.
          ssh vps "cd '$dir' && bash -s" <<'EOF'
          set -e
          if [ ! -f generated.env ]; then
            p=$(openssl rand -hex 32); o=$(openssl rand -hex 32)
            if [ ${#p} -ne 64 ] || [ ${#o} -ne 64 ]; then echo "::error::openssl rand failed on the VPS; generated.env not written."; exit 1; fi
            (umask 077; printf 'POSTGRES_PASSWORD=%s\nAuth__OtpSecret=%s\n' "$p" "$o" > generated.env.tmp)
            mv generated.env.tmp generated.env
          fi
          if ! grep -q '^POSTGRES_PASSWORD=.' generated.env || ! grep -q '^Auth__OtpSecret=.' generated.env; then
            echo "::error::generated.env has an empty value; fix it by hand (the database keeps its first password)."; exit 1
          fi
          EOF
          # The VPS pulls only the layers it doesn't have yet. The job's token is short-lived; log out right after.
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"
          ssh vps "docker pull -q '$IMAGE'; s=\$?; docker logout ghcr.io >/dev/null; exit \$s"
          scp deploy/docker-compose.yml "vps:$dir/docker-compose.yml"
          scp deploy.env "vps:$dir/.env"
          ssh vps "chmod 600 '$dir/.env'"
          rm -f deploy.env

      - name: Start
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          dir="${DEPLOY_DIR:-drivealt}"; dir="${dir#\~/}"
          ssh vps "cd '$dir' && docker compose --env-file generated.env --env-file .env up -d --no-build --remove-orphans"
          for i in $(seq 1 30); do
            if ssh vps "curl -fsS http://127.0.0.1:\$(grep '^APP_PORT=' '$dir/.env' | cut -d= -f2)/api/health" >/dev/null 2>&1; then
              echo "DriveAlt is up"
              # Drop older DriveAlt images (docker refuses to remove the one in use).
              ssh vps "docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '^(ghcr.io/[^/]+/)?drivealt:' | grep -vxF '$IMAGE' | xargs -r docker rmi >/dev/null 2>&1; docker image prune -f >/dev/null"
              exit 0
            fi
            sleep 4
          done
          echo "::error::App did not become healthy"; ssh vps "cd '$dir' && docker compose --env-file generated.env --env-file .env logs --tail 80 app"; exit 1

      - name: Make sure Caddy routes DriveAlt
        run: ssh vps 'bash -s' < deploy/ensure-caddy.sh

      - name: Check the public address
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          url="${PUBLIC_URL:-https://drivealt.tryzarqa.com}"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url/api/health" || true)
            if [ "$code" = 200 ]; then echo "$url is up"; exit 0; fi
            sleep 6
          done
          echo "::error::$url/api/health answered $code (525 = Cloudflare can't reach Caddy over TLS for this host)"; exit 1
